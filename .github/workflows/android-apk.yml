name: Android APK

# 每次推 master / 打 v* tag / 手动触发时，用 GitHub Actions 构建 debug APK。
# 用仓库内固定 debug keystore 签名，保证每次产物证书一致；不是发布签名。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      # pubspec.lock 里的 source url 指向国内镜像；CI 在境外网络下
      # 直接 --enforce-lockfile 会拉不到，这里只把 lock 的 host 换成
      # 官方源（不落盘提交），保留所有版本与 sha256 不变。
      - name: Normalize lockfile host for CI
        run: sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter compact --concurrency=1

      - name: Build debug APK
        run: flutter build apk --debug

      # 固定签名的验收点：apksigner 负责验签，keytool 负责从 APK 内证书
      # 读指纹并与仓库内固定 keystore 比对。不用 grep apksigner 的
      # --print-certs 文本（不同 build-tools 版本输出 SHA-1/SHA-256 格式不同）。
      - name: Verify APK signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify "$APK"
          normalize() { tr -d ':' | tr '[:lower:]' '[:upper:]'; }
          APK_SHA1=$(keytool -printcert -jarfile "$APK" \
            | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' \
            | head -n 1 | normalize)
          KEY_SHA1=$(keytool -list -v \
            -keystore android/app/vault-debug.keystore \
            -alias vault-debug -storepass android \
            | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' \
            | head -n 1 | normalize)
          test -n "$APK_SHA1" || { echo '无法从 APK 读取证书 SHA1'; exit 1; }
          test "$APK_SHA1" = "$KEY_SHA1" || {
            echo "APK 证书 $APK_SHA1 与固定 keystore $KEY_SHA1 不一致"; exit 1; }
          echo "APK 签名证书一致：$APK_SHA1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
