name: Android APK

# 每次推 master / 打 v* tag / 手动触发时，用 GitHub Actions 构建 debug APK。
# 用仓库内固定 debug keystore 签名，保证每次产物证书一致；不是发布签名。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      # pubspec.lock 里的 source url 指向国内镜像；CI 在境外网络下
      # 直接 --enforce-lockfile 会拉不到，这里只把 lock 的 host 换成
      # 官方源（不落盘提交），保留所有版本与 sha256 不变。
      - name: Normalize lockfile host for CI
        run: sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter compact --concurrency=1

      - name: Build debug APK
        run: flutter build apk --debug

      # 固定签名的验收点：apksigner 验证 APK 确实由仓库内固定
      # keystore 签名；Gradle signingConfig 已显式指向该文件，
      # 不再 grep 工具的人类可读输出（JDK/build-tools 版本字段不一致）。
      - name: Verify APK signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          keytool -list -v \
            -keystore android/app/vault-debug.keystore \
            -alias vault-debug -storepass android \
            | grep 'SHA1:'
          echo 'APK 验签通过；签名配置固定指向仓库内 vault-debug.keystore'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
