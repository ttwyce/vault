name: Android APK

# 每次推 master / 打 v* tag / 手动触发时，用 GitHub Actions 构建 debug APK。
# 用仓库内固定 debug keystore 签名，保证每次产物证书一致；不是发布签名。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      # pubspec.lock 里的 source url 指向国内镜像；CI 在境外网络下
      # 直接 --enforce-lockfile 会拉不到，这里只把 lock 的 host 换成
      # 官方源（不落盘提交），保留所有版本与 sha256 不变。
      - name: Normalize lockfile host for CI
        run: sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter compact --concurrency=1

      - name: Build debug APK
        run: flutter build apk --debug

      # 固定签名的验收点：每次 CI 产物都应打印同一份证书指纹。
      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-debug.apk | tee apk-signing.txt
          grep -q '54:E9:99:07:67:A0:B1:CE:AE:FF:8A:F9:FE:9F:12:62:E4:E1:D1:07' \
            apk-signing.txt || { echo 'APK 签名指纹与固定 debug keystore 不一致'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
