<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾遗 · 全部页面设计稿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.0.8/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/newsreader@5.0.9/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.8/500.css">
<style>
:root{
  --paper:#F2EDE3; --paper-hi:#FAF7F0; --ink:#17150F; --ink-2:#4A463A; --ink-3:#8B8474;
  --rule:#D8D0BF; --rule-soft:#E6DFD1; --accent:#B23A20; --accent-soft:#F0DDD4;
  --machine:#14181A; --machine-2:#1B2123; --machine-rule:#2A3134;
  --m-text:#E9E3D5; --m-dim:#8B9189; --m-accent:#E8623C;
  --board:#E8E3D8; --board-ink:#6B6455;
  --serif:'Newsreader',Georgia,'Songti SC','Noto Serif CJK SC',serif;
  --display:'Instrument Serif','Newsreader',Georgia,'Songti SC',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --s:1; --sm:.75;
}
[data-theme="ink"]{
  --paper:#12100C; --paper-hi:#1A1712; --ink:#EFE8D8; --ink-2:#B5AC98; --ink-3:#7C7466;
  --rule:#2C2820; --rule-soft:#221E18; --accent:#E8623C; --accent-soft:#2A1A14;
  --machine:#1B1915; --machine-2:#241F19; --machine-rule:#332D25;
  --m-text:#EFE8D8; --m-dim:#8B8474; --m-accent:#F0744E;
  --board:#0A0906; --board-ink:#6E6758;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--board);color:var(--ink);font-family:var(--serif);transition:background .45s ease;padding:0 0 80px}

.board-head{
  padding:34px clamp(20px,4vw,56px) 22px;border-bottom:1px solid rgba(128,120,100,.28);
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.board-head h1{font-family:var(--display);font-size:30px;font-weight:400;color:var(--ink);letter-spacing:-.01em}
.board-head p{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--board-ink);margin-top:6px}
.board-actions{display:flex;gap:10px;align-items:center}
.tbtn{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:none;border:1px solid var(--board-ink);color:var(--board-ink);padding:7px 13px;cursor:pointer;transition:.2s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}

.group{padding:40px clamp(20px,4vw,56px) 0}
.ghead{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.ghead h2{font-family:var(--display);font-size:20px;font-weight:400;color:var(--ink)}
.ghead .mono{color:var(--board-ink)}

.shots{display:flex;flex-direction:column;gap:36px}
.shot{display:flex;flex-direction:column;gap:10px}
.shot figcaption{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--board-ink)}
.shot figcaption b{color:var(--accent);font-weight:400}

.wrap{width:calc(1120px * var(--s));height:calc(700px * var(--s));overflow:hidden}
.wrap.sm{width:calc(390px * var(--sm));height:calc(844px * var(--sm))}
.screen{width:1120px;height:700px;transform:scale(var(--s));transform-origin:0 0;
  background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:13px;line-height:1.62;
  display:flex;overflow:hidden;position:relative;border:1px solid rgba(128,120,100,.3)}
.phone{width:390px;height:844px;transform:scale(var(--sm));transform-origin:0 0;
  background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.6;
  display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:26px;
  border:1px solid rgba(128,120,100,.35)}

.mono{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.hr{height:1px;background:var(--rule-soft)}
.dim{color:var(--ink-2)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--rule);padding:1px 5px}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:1px 5px;border:1px solid var(--rule);color:var(--ink-3)}
.badge.on{color:var(--accent);border-color:var(--accent)}
.badge.dead{border-style:dashed}
.dot{width:4px;height:4px;background:var(--accent);border-radius:50%;display:inline-block}

/* 通用三栏骨架 */
.rail{width:56px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;
  align-items:center;padding:16px 0 14px;background:var(--paper)}
.rail .mark{width:22px;height:22px;border:1px solid var(--ink);display:grid;place-items:center;
  font-family:var(--display);font-size:13px;margin-bottom:22px}
.rail nav{display:flex;flex-direction:column;gap:20px;align-items:center;flex:1}
.rail .it{writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;color:var(--ink-3);cursor:pointer;position:relative}
.rail .it.on{color:var(--ink)}
.rail .it.on::before{content:'';position:absolute;right:-11px;top:0;bottom:0;width:2px;background:var(--accent)}
.rail .foot{writing-mode:vertical-rl;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--ink-3);opacity:.7}

.machine{width:330px;flex:none;background:var(--machine);color:var(--m-text);display:flex;flex-direction:column;
  border-left:1px solid var(--machine-rule)}
.mhead{padding:14px 16px;border-bottom:1px solid var(--machine-rule);display:flex;align-items:center;justify-content:space-between}
.mbrand{display:flex;align-items:center;gap:7px}
.mbrand .g{width:16px;height:16px;border:1px solid var(--m-accent);display:grid;place-items:center}
.mbrand .g::before{content:'';width:5px;height:5px;background:var(--m-accent)}
.mbrand span{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--m-text)}
.mstate{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--m-dim);display:flex;align-items:center;gap:5px}
.mstate .d{width:4px;height:4px;border-radius:50%;background:var(--m-accent)}
.mblock{padding:14px 16px;border-bottom:1px solid var(--machine-rule)}
.mlab{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--m-dim);margin-bottom:9px}
.mtext{font-size:12.5px;line-height:1.6;color:var(--m-text)}
.mtext em{font-style:italic;color:var(--m-accent)}
.mquote{font-size:12px;line-height:1.75;color:var(--m-text);border-left:2px solid var(--m-accent);padding-left:10px}
.mquote .src{display:block;margin-top:7px;font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--m-dim)}
.mref{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--machine-rule);font-size:11.5px;color:var(--m-text)}
.mref .meta{font-family:var(--mono);font-size:8px;color:var(--m-dim);flex:none}
.steps{list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:13px 1fr auto;gap:8px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.03em;color:var(--m-dim);opacity:.4}
.steps li.done,.steps li.active{opacity:1;color:var(--m-text)}
.steps li.done .mk,.steps li.active .mk{color:var(--m-accent)}
.steps li .res{font-size:8px;color:var(--m-dim)}
.minput{border-top:1px solid var(--machine-rule);padding:11px 14px;display:flex;align-items:center;gap:8px;margin-top:auto}
.minput span{flex:1;font-size:11.5px;color:var(--m-dim);font-style:italic}
.minput .k{width:24px;height:24px;border:1px solid var(--machine-rule);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--m-text)}

/* 列表 */
.list{width:296px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;background:var(--paper)}
.lsearch{padding:11px 12px;border-bottom:1px solid var(--rule)}
.lsearch div{height:26px;border:1px solid var(--rule);display:flex;align-items:center;padding:0 8px;
  font-size:11px;color:var(--ink-3);font-style:italic;background:var(--paper-hi)}
.li{padding:11px 12px 11px 14px;border-bottom:1px solid var(--rule-soft);cursor:pointer;position:relative}
.li.on{background:var(--accent-soft)}
.li.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.li h4{font-size:13.5px;font-weight:500;line-height:1.4;color:var(--ink)}
.li p{font-size:11.5px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--ink-3);margin-top:5px}

.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.topbar{height:44px;flex:none;border-bottom:1px solid var(--rule);display:flex;align-items:center;
  justify-content:space-between;padding:0 18px}
.seg{display:flex;border:1px solid var(--rule)}
.seg span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:4px 9px;color:var(--ink-3);cursor:pointer}
.seg span.on{background:var(--ink);color:var(--paper)}

/* 媒体占位 */
.ph{background:var(--rule-soft);position:relative;overflow:hidden}
.ph::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(128,120,100,.12) 6px 7px)}

@media (max-width:1240px){:root{--s:.88}}
@media (max-width:1080px){:root{--s:.72;--sm:.62}}
@media (max-width:860px){:root{--s:.55;--sm:.5}}
@media (max-width:640px){:root{--s:.4;--sm:.42}}
@media (max-width:460px){:root{--s:.32;--sm:.36}}
</style>
</head>
<body>

<div class="board-head">
  <div>
    <h1>拾遗 · 页面设计稿</h1>
    <p>11 screens · desktop 1120×700 · mobile 390×844</p>
  </div>
  <div class="board-actions">
    <button class="tbtn" id="themeBtn">纸 / 墨</button>
  </div>
</div>

<!-- ============================ 桌面端 ============================ -->
<section class="group">
  <div class="ghead"><h2>桌面端</h2><span class="mono">7 screens</span></div>
  <div class="shots">

    <!-- ---------- 01 收件台 ---------- -->
    <figure class="shot">
      <div class="wrap"><div class="screen">
        <aside class="rail">
          <div class="mark">拾</div>
          <nav>
            <div class="it on">记录</div><div class="it">归档</div><div class="it">密码</div><div class="it">助手</div>
          </nav>
          <div class="foot">134</div>
        </aside>

        <main style="flex:1;min-width:0;padding:0 40px;display:flex;flex-direction:column;overflow:hidden">
          <header style="display:flex;align-items:flex-end;justify-content:space-between;
            padding:22px 0 12px;border-bottom:1px solid var(--ink)">
            <div style="display:flex;align-items:baseline;gap:10px">
              <span style="font-family:var(--display);font-size:30px;line-height:1">拾遗</span>
              <span class="mono" style="padding-bottom:3px">VOL. 03</span>
            </div>
            <div style="display:flex;align-items:center;gap:14px;padding-bottom:2px">
              <span class="mono">2026 · 11 · 08</span>
              <span style="width:1px;height:10px;background:var(--rule)"></span>
              <span style="display:flex;align-items:center;gap:6px"><span class="dot"></span><span class="mono">已同步 14:08</span></span>
            </div>
          </header>

          <section style="padding:22px 0 18px;border-bottom:1px solid var(--rule)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              <span style="font-family:var(--display);font-size:11px;color:var(--accent)">01</span>
              <span class="mono">收件台</span>
            </div>
            <div style="font-family:var(--serif);font-size:23px;line-height:1.4;color:var(--ink-3);font-style:italic">
              把链接、一段文字、一张截图丢进来 —— AI 替你整理
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;
              padding-top:12px;border-top:1px solid var(--rule-soft)">
              <div style="display:flex;gap:16px">
                <span class="mono" style="color:var(--ink);border-bottom:1px solid var(--accent);padding-bottom:2px">粘贴</span>
                <span class="mono">网页</span><span class="mono">图片</span><span class="mono">语音</span>
                <span class="mono" style="opacity:.55;margin-left:6px">⌘V 即分析</span>
              </div>
              <div style="background:var(--accent);color:#fff;font-family:var(--mono);font-size:9.5px;
                letter-spacing:.16em;padding:8px 15px">交给 AI →</div>
            </div>
          </section>

          <div style="display:flex;align-items:center;gap:12px;padding:20px 0 2px">
            <span class="mono">11月8日 · 周六</span>
            <span style="flex:1;height:1px;background:var(--rule-soft)"></span>
            <span class="mono">4 条</span>
          </div>

          <div style="overflow:hidden">
            <article style="display:grid;grid-template-columns:44px 1fr;gap:0 14px;padding:14px 0;border-bottom:1px solid var(--rule-soft);position:relative">
              <div class="mono" style="padding-top:4px">14:02</div>
              <div>
                <h3 style="font-size:16.5px;font-weight:500;line-height:1.45">WebDAV 限流的退避策略</h3>
                <p style="font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.65">
                  不该只看 HTTP 状态码，还要看本地队列积压量。积压多的时候应该更激进地降频。</p>
                <div style="display:flex;align-items:center;gap:7px;margin-top:8px">
                  <span class="dot"></span><span class="mono">AI 归类为 <b style="color:var(--accent);font-weight:500">想法</b></span>
                  <span class="tag">#webdav</span><span class="tag">#退避</span><span class="mono">关联 3 条</span>
                </div>
              </div>
            </article>

            <article style="display:grid;grid-template-columns:44px 1fr;gap:0 14px;padding:14px 0;border-bottom:1px solid var(--rule-soft)">
              <div class="mono" style="padding-top:4px">11:46</div>
              <div>
                <h3 style="font-size:16.5px;font-weight:500;line-height:1.45">RFC 6578：增量同步的正确用法</h3>
                <p style="font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.65">
                  sync-collection REPORT 一次就能拿到全部增量和删除列表，但坚果云不支持。</p>
                <div style="display:flex;align-items:center;gap:7px;margin-top:8px">
                  <span class="dot"></span><span class="mono">AI 归档 <b style="color:var(--accent);font-weight:500">网页</b></span>
                  <span class="tag">#同步</span><span class="badge on">有快照</span>
                </div>
              </div>
            </article>

            <article style="display:grid;grid-template-columns:44px 1fr;gap:0 14px;padding:14px 0">
              <div class="mono" style="padding-top:4px">09:20</div>
              <div>
                <h3 style="font-size:16.5px;font-weight:500;line-height:1.45">一篇讲 CRDT 的长文</h3>
                <div style="display:flex;align-items:center;gap:7px;margin-top:8px">
                  <span class="dot"></span><span class="mono">AI 检测到 <b style="color:var(--accent);font-weight:500">死链</b></span>
                  <span class="badge dead">原站已失效</span><span class="badge on">已回退到快照</span>
                </div>
              </div>
            </article>
          </div>
        </main>

        <aside class="machine">
          <div class="mhead">
            <div class="mbrand"><div class="g"></div><span>SKAI</span></div>
            <div class="mstate"><span class="d"></span>端侧模型 · 就绪</div>
          </div>
          <div class="mblock">
            <div class="mlab">当前任务</div>
            <div class="mtext" style="margin-bottom:11px">正在分析你刚丢进来的链接</div>
            <ol class="steps">
              <li class="done"><span class="mk">✓</span><span>抓取正文</span><span class="res">2.1s · 4,182 字</span></li>
              <li class="done"><span class="mk">✓</span><span>判定类型</span><span class="res">笔记</span></li>
              <li class="done"><span class="mk">✓</span><span>提取要点</span><span class="res">3 条</span></li>
              <li class="done"><span class="mk">✓</span><span>生成标签</span><span class="res">#webdav</span></li>
              <li class="done"><span class="mk">✓</span><span>关联旧条目</span><span class="res">3 条</span></li>
              <li class="active"><span class="mk">◐</span><span>归档快照</span><span class="res">PDF…</span></li>
            </ol>
          </div>
          <div class="mblock">
            <div class="mlab">今天</div>
            <p class="mquote">「你今天主要在跟 WebDAV 的限流较劲。三条记录指向同一个结论 —— 退避不该只看状态码。」
              <span class="src">14:02 · 引用 3 条</span></p>
            <div style="margin-top:10px">
              <div class="mref"><span>WebDAV 限流的退避策略</span><span class="meta">14:02</span></div>
              <div class="mref"><span>RFC 6578 增量同步</span><span class="meta">11:46</span></div>
            </div>
          </div>
          <div class="minput"><span>问点什么，或者再丢一条进来</span><div class="k">↵</div></div>
        </aside>
      </div></div>
      <figcaption><b>01</b> 收件台 · 首页 —— 主入口，右侧墨栏常驻</figcaption>
    </figure>

    <!-- ---------- 02 笔记编辑 ---------- -->
    <figure class="shot">
      <div class="wrap"><div class="screen">
        <aside class="rail">
          <div class="mark">拾</div>
          <nav><div class="it on">记录</div><div class="it">归档</div><div class="it">密码</div><div class="it">助手</div></nav>
          <div class="foot">134</div>
        </aside>

        <div class="list">
          <div class="lsearch"><div>搜索…</div></div>
          <div class="li on">
            <h4>多端同步的冲突处理方案</h4>
            <p>base / local / remote 三份数据…</p>
            <div class="m">08-12 · 笔记 · 编辑中</div>
          </div>
          <div class="li"><h4>WebDAV 限流的退避策略</h4><p>不该只看状态码…</p><div class="m">08-12 · 想法</div></div>
          <div class="li"><h4>RFC 6578 增量同步</h4><p>sync-collection 的用法…</p><div class="m">08-11 · 归档</div></div>
          <div class="li"><h4>密码库迁移清单</h4><p>17 条待核对…</p><div class="m">08-10 · 密码</div></div>
        </div>

        <div class="detail">
          <div class="topbar">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="mono">←</span><span class="mono">笔记</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span class="mono" style="opacity:.7">已保存 · 刚刚</span>
              <span class="mono">⋯</span>
            </div>
          </div>

          <div style="padding:34px 56px 0;overflow:hidden">
            <h1 style="font-size:29px;font-weight:500;line-height:1.35;letter-spacing:-.01em">
              多端同步的冲突处理方案</h1>
            <div style="display:flex;gap:12px;margin-top:9px">
              <span class="mono">2026 · 08 · 12</span><span class="mono">1,240 字</span><span class="mono">#同步</span>
            </div>
            <div style="height:1px;background:var(--rule);margin:18px 0 20px"></div>

            <p style="font-size:14.5px;line-height:1.85;color:var(--ink)">
              base / local / remote 三份数据缺一不可。没有 base 就无法判断「谁改了哪一段」，只能退化为整条替换 —— 这是最粗暴、也最容易丢数据的做法。</p>
            <p style="font-size:14.5px;line-height:1.85;color:var(--ink);margin-top:14px">
              删除永远不能覆盖一次未同步的编辑。宁可复活一条用户以为删掉的内容，也不能吞掉一次修改。
              <span style="background:var(--accent-soft);border-bottom:1px solid var(--accent);padding:0 2px">编辑优先，条目复活</span>，
              这条规则写在冲突矩阵的第 8、9 行。</p>
