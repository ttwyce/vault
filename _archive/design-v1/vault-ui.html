<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾遗 · 页面设计稿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/figtree@5.0.9/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/figtree@5.0.9/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/figtree@5.0.9/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.0.8/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.8/500.css">
<style>
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F6F8FB;
  --line:#E4E8EF;
  --line-2:#EFF2F7;
  --ink:#0F172B;
  --ink-2:#566175;
  --ink-3:#8A94A6;
  --accent:#0284C7;
  --accent-bright:#03A9F4;
  --accent-soft:#E9F6FE;
  --accent-line:#BCE4FA;
  --ok:#0E9F6E;
  --warn:#B4740A;
  --bad:#D93025;
  --shadow:0 1px 2px rgba(15,23,43,.05),0 10px 30px rgba(15,23,43,.07);
  --r:10px;
  --sans:'Figtree','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --s:1;--sm:.72;
}
[data-theme="dark"]{
  --bg:#0F172B;
  --surface:#141E33;
  --surface-2:#1A2540;
  --line:#243149;
  --line-2:#1C2740;
  --ink:#EDF2FA;
  --ink-2:#9DABC2;
  --ink-3:#6A7994;
  --accent:#38BDF8;
  --accent-bright:#38BDF8;
  --accent-soft:#11263A;
  --accent-line:#1E4A6B;
  --ok:#3DDC97;
  --warn:#E8B34B;
  --bad:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;
  transition:background .3s ease,color .3s ease;padding-bottom:72px}

/* ---------- 展板 ---------- */
.bhead{padding:26px clamp(20px,4vw,48px) 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface)}
.bhead h1{font-size:19px;font-weight:600;letter-spacing:-.025em}
.bhead p{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);margin-top:4px}
.tbtn{font-family:var(--sans);font-size:11.5px;font-weight:500;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);padding:7px 14px;border-radius:var(--r);cursor:pointer;transition:.15s}
.tbtn:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}

.group{padding:34px clamp(20px,4vw,48px) 0}
.ghead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.ghead h2{font-size:13px;font-weight:600;letter-spacing:-.01em}
.ghead span{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.05em}
.shots{display:flex;flex-direction:column;gap:28px}
.shot{display:flex;flex-direction:column;gap:8px}
.shot figcaption{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-3)}
.shot figcaption b{color:var(--accent);font-weight:500;margin-right:6px}

.wrap{width:calc(1120px * var(--s));height:calc(700px * var(--s));overflow:hidden;
  border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.wrap.sm{width:calc(390px * var(--sm));height:calc(844px * var(--sm));border-radius:26px}
.screen{width:1120px;height:700px;transform:scale(var(--s));transform-origin:0 0;background:var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;display:flex;overflow:hidden;position:relative}
.phone{width:390px;height:844px;transform:scale(var(--sm));transform-origin:0 0;background:var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 原子 ---------- */
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tag{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);border:1px solid var(--line);
  padding:1px 6px;border-radius:6px;background:var(--surface)}
.bdg{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:6px;
  border:1px solid var(--line);color:var(--ink-3);background:var(--surface)}
.bdg.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.bdg.ok{color:var(--ok);border-color:transparent;background:color-mix(in srgb,var(--ok) 11%,transparent)}
.bdg.bad{color:var(--bad);border-color:transparent;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.ai-mark{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.05em;color:var(--ink-2);border:1px dashed var(--line);padding:1px 6px;border-radius:6px}
.ai-mark svg{width:9px;height:9px;stroke:var(--accent-bright);fill:none;stroke-width:1.6}

/* ---------- 应用骨架 ---------- */
.rail{width:52px;flex:none;border-right:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;padding:14px 0}
.rail .logo{width:26px;height:26px;border-radius:8px;
  background:linear-gradient(160deg,var(--accent-bright),var(--accent));color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:600;margin-bottom:20px;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent-bright) 35%,transparent)}
.rail nav{display:flex;flex-direction:column;gap:4px;flex:1;width:100%;align-items:center}
.nav-i{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);cursor:pointer;transition:.15s}
.nav-i:hover{background:var(--surface-2);color:var(--ink-2)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.nav-i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail .dot-ok{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-bottom:6px}

.panel{background:var(--surface);display:flex;flex-direction:column;min-width:0}
.panel.list{width:280px;flex:none;border-right:1px solid var(--line)}
.panel.ai{width:308px;flex:none;border-left:1px solid var(--line);background:var(--surface-2)}
.panel.main{flex:1}

.phead{height:46px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;gap:10px}
.pbody{flex:1;overflow:hidden}

.sbox{height:32px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--ink-3);font-size:11.5px}
.sbox svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}

.row{padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;position:relative;transition:.12s}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--accent-soft)}
.row.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.row h4{font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ink);letter-spacing:-.005em}
.row p{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:5px;display:flex;gap:6px;align-items:center}

.btn{height:31px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 4px 14px color-mix(in srgb,var(--accent-bright) 30%,transparent)}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
[data-theme="dark"] .btn.pri{color:#062033}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:25px;padding:0 9px;font-size:10.5px;border-radius:7px}

.ablk{padding:14px;border-bottom:1px solid var(--line)}
.astep{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:baseline;
  font-size:11.5px;color:var(--ink-3);padding:4px 0}
.astep.done{color:var(--ink)}
.astep.done .mk{color:var(--ok)}
.astep.act{color:var(--ink)}
.astep.act .mk{color:var(--accent-bright)}
.astep .mk{font-family:var(--mono);font-size:10px}
.astep .r{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.acard{border:1px dashed var(--line);border-radius:var(--r);padding:9px 11px;background:var(--surface)}

.mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.mnav{display:flex;justify-content:space-around;align-items:center;padding:9px 0 20px;
  border-top:1px solid var(--line);background:var(--surface)}
.mnav span{font-size:10px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
.mnav span.on{color:var(--accent)}
.mnav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

.glow{position:absolute;left:0;right:0;top:-90px;height:300px;pointer-events:none;
  background:radial-gradient(ellipse 60% 100% at 50% 100%,
    color-mix(in srgb,var(--accent-bright) 10%,transparent),transparent 72%)}

@media (max-width:1240px){:root{--s:.88}}
@media (max-width:1080px){:root{--s:.72;--sm:.6}}
@media (max-width:860px){:root{--s:.55;--sm:.48}}
@media (max-width:640px){:root{--s:.4;--sm:.4}}
@media (max-width:460px){:root{--s:.32;--sm:.34}}
</style>
</head>
<body>

<div class="bhead">
  <div>
    <h1>拾遗 · 页面设计稿</h1>
    <p>11 screens · desktop 1120×700 · mobile 390×844</p>
  </div>
  <button class="tbtn" id="themeBtn">切换主题</button>
</div>

<!-- ===================== 桌面端 ===================== -->
<section class="group">
  <div class="ghead"><h2>桌面端</h2><span>7 screens</span></div>
  <div class="shots">

    <!-- 01 收件台 -->
    <figure class="shot">
      <div class="wrap"><div class="screen">
        <aside class="rail">
          <div class="logo">拾</div>
          <nav>
            <div class="nav-i on"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></svg></div>
            <div class="nav-i"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 10h16"/></svg></div>
            <div class="nav-i"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M11.4 11.4L18 18"/></svg></div>
            <div class="nav-i"><svg viewBox="0 0 24 24"><path d="M12 4.5l1.6 4.4 4.4 1.6-4.4 1.6L12 16.5l-1.6-4.4L6 10.5l4.4-1.6z"/></svg></div>
          </nav>
          <div class="dot-ok"></div>
        </aside>

        <main class="panel main" style="padding:0 38px;position:relative">
          <div class="glow"></div>
          <header style="display:flex;align-items:center;justify-content:space-between;padding:16px 0 15px;border-bottom:1px solid var(--line);position:relative">
            <div style="display:flex;align-items:center;gap:9px">
              <span style="font-size:15px;font-weight:600;letter-spacing:-.025em">收件台</span>
              <span class="mono">134 条</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="mono">已同步 14:08</span>
              <div class="btn sm">同步</div>
            </div>
          </header>

          <section style="padding:28px 0 22px;border-bottom:1px solid var(--line);position:relative">
            <div style="border:1px solid var(--accent-line);border-radius:var(--r);background:var(--surface);
              box-shadow:0 8px 32px color-mix(in srgb,var(--accent-bright) 12%,transparent);overflow:hidden">
              <div style="padding:16px 16px 14px;font-size:15.5px;color:var(--ink-3);font-weight:400;letter-spacing:-.01em">
                把链接、一段文字、一张截图丢进来 —— AI 替你整理
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 11px;
                border-top:1px solid var(--line-2);background:var(--surface-2)">
                <div style="display:flex;gap:2px">
                  <span class="btn sm" style="background:var(--surface);border-color:var(--line)">粘贴</span>
                  <span class="btn sm ghost">网页</span>
                  <span class="btn sm ghost">图片</span>
                  <span class="btn sm ghost">语音</span>
                </div>
                <div style="display:flex;align-items:center;gap:10px">
                  <span class="mono">⌘V</span>
                  <div class="btn pri sm">交给 AI</div>
                </div>
              </div>
            </div>
          </section>

          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px">
            <span class="lab">今天 · 4 条</span>
            <span class="mono">全部 / 未读</span>
          </div>

          <div>
            <article style="display:grid;grid-template-columns:42px 1fr;gap:0 12px;padding:13px 0;border-bottom:1px solid var(--line-2)">
              <div class="mono" style="padding-top:2px">14:02</div>
              <div>
                <h3 style="font-size:13.5px;font-weight:500;letter-spacing:-.01em">WebDAV 限流的退避策略</h3>
                <p style="font-size:12px;color:var(--ink-2);margin-top:3px">不该只看 HTTP 状态码，还要看本地队列积压量。积压多时应该更激进地降频。</p>
                <div style="display:flex;gap:5px;align-items:center;margin-top:8px">
                  <span class="ai-mark"><svg viewBox="0 0 24 24"><path d="M12 4l1.5 4.5L18 10l-4.5 1.5L12 16l-1.5-4.5L6 10l4.5-1.5z"/></svg>想法</span>
                  <span class="tag">#webdav</span><span class="tag">#退避</span>
                  <span class="mono">关联 3</span>
                </div>
              </div>
            </article>

            <article style="display:grid;grid-template-columns:42px 1fr;gap:0 12px;padding:13px 0;border-bottom:1px solid var(--line-2)">
              <div class="mono" style="padding-top:2px">11:46</div>
              <div>
                <h3 style="font-size:13.5px;font-weight:500;letter-spacing:-.01em">RFC 6578：增量同步的正确用法</h3>
                <p style="font-size:12px;color:var(--ink-2);margin-top:3px">sync-collection 一次拿到全部增量和删除列表，但坚果云不支持。</p>
                <div style="display:flex;gap:5px;align-items:center;margin-top:8px">
                  <span class="ai-mark"><svg viewBox="0 0 24 24"><path d="M12 4l1.5 4.5L18 10l-4.5 1.5L12 16l-1.5-4.5L6 10l4.5-1.5z"/></svg>网页</span>
                  <span class="tag">#同步</span><span class="bdg ok">有快照</span>
                </div>
              </div>
            </article>

            <article style="display:grid;grid-template-columns:42px 1fr;gap:0 12px;padding:13px 0">
              <div class="mono" style="padding-top:2px">09:20</div>
              <div>
                <h3 style="font-size:13.5px;font-weight:500;letter-spacing:-.01em">一篇讲 CRDT 的长文</h3>
                <div style="display:flex;gap:5px;align-items:center;margin-top:8px">
                  <span class="ai-mark"><svg viewBox="0 0 24 24"><path d="M12 4l1.5 4.5L18 10l-4.5 1.5L12 16l-1.5-4.5L6 10l4.5-1.5z"/></svg>死链</span>
                  <span class="bdg bad">原站失效</span><span class="bdg ok">已回退快照</span>
                </div>
              </div>
            </article>
          </div>
        </main>

        <aside class="panel ai">
          <div class="phead">
            <div style="display:flex;align-items:center;gap:7px">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:var(--accent-bright);fill:none;stroke-width:1.7"><path d="M12 4l1.6 4.4 4.4 1.6-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z"/></svg>
              <span style="font-family:var(--serif);font-size:14px;letter-spacing:.02em">SKAI</span>
            </div>
            <span class="mono">端侧 · 就绪</span>
          </div>
          <div class="pbody">
            <div class="ablk">
              <div class="lab" style="margin-bottom:8px">正在处理</div>
              <div style="font-size:12px;color:var(--ink);margin-bottom:9px">分析你刚丢进来的链接</div>
              <div class="astep done"><span class="mk">✓</span><span>抓取正文</span><span class="r">4,182 字</span></div>
              <div class="astep done"><span class="mk">✓</span><span>判定类型</span><span class="r">笔记</span></div>
              <div class="astep done"><span class="mk">✓</span><span>提取要点</span><span class="r">3 条</span></div>
              <div class="astep done"><span class="mk">✓</span><span>生成标签</span><span class="r">#webdav</span></div>
              <div class="astep act"><span class="mk">◐</span><span>关联旧条目</span><span class="r">3 条</span></div>
              <div class="astep"><span class="mk">○</span><span>归档快照</span><span class="r">—</span></div>
            </div>

            <div class="ablk">
              <div class="lab" style="margin-bottom:8px">今天</div>
              <div class="acard">
                <div style="font-size:12px;line-height:1.65">你今天主要在跟 WebDAV 的限流较劲。三条记录指向同一个结论 —— 退避不该只看状态码。</div>
                <div class="mono" style="margin-top:7px">14:02 · 引用 3 条</div>
              </div>
              <div style="margin-top:9px;display:flex;flex-direction:column;gap:1px">
                <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:11.5px;border-bottom:1px solid var(--line-2)">
                  <span>WebDAV 限流的退避策略</span><span class="mono">14:02</span></div>
                <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:11.5px">
                  <span>RFC 6578 增量同步</span><span class="mono">11:46</span></div>
              </div>
            </div>

            <div class="ablk" style="border-bottom:none">
              <div class="lab" style="margin-bottom:8px">待你决定</div>
              <div style="font-size:11.5px;color:var(--ink-2);line-height:1.6">有 1 个冲突副本等你处理。</div>
              <div class="btn sm" style="margin-top:9px">去处理</div>
            </div>
          </div>
          <div style="border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;background:var(--surface)">
            <div style="flex:1;font-size:11.5px;color:var(--ink-3)">问点什么，或再丢一条进来</div>
            <div class="btn sm" style="padding:0 8px">↵</div>
          </div>
        </aside>
      </div></div>
      <figcaption><b>01</b>收件台 · 首页 —— 输入框带天蓝光晕，AI 面板常驻右侧</figcaption>
    </figure>

    <!-- 02 笔记编辑 -->
    <figure class="shot">
      <div class="wrap"><div class="screen">
        <aside class="rail">
          <div class="logo">拾</div>
          <nav>
            <div class="nav-i on"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></svg></div>
            <div class="nav-i"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 10h16"/></svg></div>
            <div class="nav-i"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M11.4 11.4L18 18"/></svg></div>
            <div class="nav-i"><svg viewBox="0 0 24 24"><path d="M12 4.5l1.6 4.4 4.4 1.6-4.4 1.6L12 16.5l-1.6-4.4L6 10.5l4.4-1.6z"/></svg></div>
          </nav>
          <div class="dot-ok"></div>
